name: find-codes
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test "tests/*.test.mjs"
      # 有码暂缓收录时这一步会报错（GitHub 发邮件提醒），但已经确认的新码照样往下提交
      - id: find
        run: node scripts/find-codes.mjs
      - name: Commit new codes
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet redeem-codes.json; then exit 0; fi
          node --test "tests/*.test.mjs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add redeem-codes.json
          git commit -m "收录新兑换码 ${{ steps.find.outputs.added }}"
          git push
